name: Repair bot

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git checkout d82dea5460353594e7ce4659f46a4734c485de87 -- bot.py
      - run: python -m py_compile bot.py topup.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py
          git rm .github/workflows/repair_bot.yml
          git commit -m "Restore bot.py after menu fix"
          git push origin main
