name: Apply Stars top-up integration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Integrate Stars top-up') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch bot.py
        shell: python
        run: |
          from pathlib import Path
          p = Path('bot.py')
          s = p.read_text(encoding='utf-8')
          marker = '# TOPUP_INTEGRATION_V1'
          if marker in s:
              raise SystemExit('already patched')

          s = s.replace(
              'from aiogram.types import InlineKeyboardButton, InlineKeyboardMarkup\n',
              'from aiogram.types import InlineKeyboardButton, InlineKeyboardMarkup\nfrom topup import register_topup_handlers\n'
          )

          s = s.replace(
              'db_pool = None\n',
              'db_pool = None\n\n# TOPUP_INTEGRATION_V1\nregister_topup_handlers(dp, bot, lambda: db_pool, SUPPORT_ID)\n',
              1
          )

          table_anchor = '''        await db.execute("""\n            CREATE TABLE IF NOT EXISTS required_chats ('''
          table_insert = '''        await db.execute("""\n            CREATE TABLE IF NOT EXISTS topup_requests (\n                id BIGSERIAL PRIMARY KEY,\n                user_id BIGINT NOT NULL,\n                username TEXT,\n                full_name TEXT,\n                amount NUMERIC(12, 2) NOT NULL,\n                gift_name TEXT NOT NULL,\n                status TEXT NOT NULL DEFAULT 'pending',\n                processed_by BIGINT DEFAULT NULL,\n                created_at TIMESTAMP DEFAULT NOW(),\n                updated_at TIMESTAMP DEFAULT NOW()\n            )\n        """)\n\n'''
          if table_anchor not in s:
              raise SystemExit('DB anchor not found')
          s = s.replace(table_anchor, table_insert + table_anchor, 1)

          menu_anchor = '''        # Группа 2: Рефералы\n'''
          menu_insert = '''        # Группа 2: Пополнение баланса\n        [\n            InlineKeyboardButton(\n                text="⭐ Пополнить баланс",\n                callback_data="topup"\n            ),\n        ],\n        # Группа 3: Рефералы\n'''
          if menu_anchor not in s:
              raise SystemExit('menu anchor not found')
          s = s.replace(menu_anchor, menu_insert, 1)

          p.write_text(s, encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot.py
          git rm .github/workflows/apply-topup-patch.yml
          git commit -m 'Integrate Stars top-up' || exit 0
          git push
