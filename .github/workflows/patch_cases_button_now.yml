name: Apply bot configuration

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure bot.py
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('bot.py')
          s = p.read_text(encoding='utf-8')

          s = re.sub(r'^MIN_WITHDRAW\s*=.*$', 'MIN_WITHDRAW = 25', s, count=1, flags=re.M)
          s = re.sub(r'^REF_BONUS\s*=.*$', 'REF_BONUS = 2', s, count=1, flags=re.M)

          s = re.sub(
              r'DEFAULT_REQUIRED\s*=\s*\[.*?\n\]\n',
              'DEFAULT_REQUIRED = [\n    {"chat_id": "@Xoylis", "title": "Основной канал"},\n]\n',
              s, count=1, flags=re.S
          )

          # Existing PostgreSQL databases may still contain the old required chats.
          # Replace the default rows on startup so only @Xoylis remains required.
          old_db = '''        for chat in DEFAULT_REQUIRED:\n            await db.execute("""\n                INSERT INTO required_chats (chat_id, title)\n                VALUES ($1, $2)\n                ON CONFLICT (chat_id) DO NOTHING\n            """, chat["chat_id"], chat["title"])'''
          new_db = '''        await db.execute("DELETE FROM required_chats WHERE chat_id <> '@Xoylis'")\n        for chat in DEFAULT_REQUIRED:\n            await db.execute("""\n                INSERT INTO required_chats (chat_id, title)\n                VALUES ($1, $2)\n                ON CONFLICT (chat_id) DO UPDATE SET title = EXCLUDED.title\n            """, chat["chat_id"], chat["title"])'''
          if old_db in s:
              s = s.replace(old_db, new_db, 1)

          # Keep only the requested main-menu actions.
          start = s.find('    # Группы кнопок\n    buttons = [')
          if start == -1:
              start = s.find('    # Основное меню: только Рефералы, Баланс и Вывод\n    buttons = [')
          if start != -1:
              end_marker = '\n\n    # Если админ – добавляем админ-панель'
              end = s.find(end_marker, start)
              if end != -1:
                  menu = '''    # Основное меню: только Рефералы, Баланс и Вывод\n    buttons = [\n        [\n            InlineKeyboardButton(\n                text="🎁 Рефералы",\n                callback_data="referrals"\n            ),\n        ],\n        [\n            InlineKeyboardButton(\n                text="💰 Баланс",\n                callback_data="balance"\n            ),\n        ],\n        [\n            InlineKeyboardButton(\n                text="💳 Вывод от 25 ⭐",\n                callback_data="withdraw"\n            ),\n        ],\n    ]'''
                  s = s[:start] + menu + s[end:]

          old_balance = '''async def balance_callback(call: types.CallbackQuery):\n    data = await get_user_data(str(call.from_user.id))'''
          new_balance = '''async def balance_callback(call: types.CallbackQuery):\n    if not await require_subscription(call):\n        return\n    data = await get_user_data(str(call.from_user.id))'''
          s = s.replace(old_balance, new_balance, 1)

          s = s.replace('подписки друга на все каналы!', 'подписки друга на основной канал!')
          s = s.replace('(пользователь подписался на все каналы)', '(пользователь подписался на основной канал)')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify
        run: python -m py_compile bot.py topup.py menu_photo_data.py

      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py menu_photo_data.py
          git commit -m "Configure referral bonus, withdrawal minimum and required channel"
          git push
