name: Patch cases button now

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch bot.py
        run: >-
          python -c "import base64; from pathlib import Path; p=Path('bot.py'); s=p.read_text(encoding='utf-8'); old=base64.b64decode('').decode(); new=base64.b64decode('').decode(); assert old in s, 'main menu block not found'; p.write_text(s.replace(old,new,1), encoding='utf-8')"

      - name: Verify
        run: python -m py_compile bot.py topup.py

      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py
          git commit -m "Add cases button directly to main menu"
          git push
