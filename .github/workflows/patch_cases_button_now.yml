name: Patch bot photo

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch bot.py
        run: >-
          python -c "from pathlib import Path; p=Path('bot.py'); s=p.read_text(encoding='utf-8'); s=s.replace('from topup import register_topup_handlers\\n','from topup import register_topup_handlers\\nfrom aiogram.types import BufferedInputFile\\nfrom menu_photo_data import menu_photo\\n',1); start=s.index('# Фото главного меню'); end=s.index('\\n\\n# Обязательные каналы/чаты',start); s=s[:start]+'# Фото главного меню — загружается из загруженного файла\\nMENU_PHOTO = BufferedInputFile(menu_photo(), filename=\\\"menu.jpg\\\")'+s[end:]; p.write_text(s,encoding='utf-8')"

      - name: Verify
        run: python -m py_compile bot.py topup.py menu_photo_data.py

      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py menu_photo_data.py
          git commit -m "Use uploaded photo in bot main menu"
          git push
