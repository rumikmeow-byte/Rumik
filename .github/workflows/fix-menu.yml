name: Fix menu buttons

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  fix:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'Fix menu buttons and remove referral leaders')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch bot menu
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('bot.py')
          s = p.read_text(encoding='utf-8')

          old = '''    # Формируем клавиатуру с разделителями (пустыми строками между группами)\n    keyboard = []\n    for i, row in enumerate(buttons):\n        keyboard.append(row)\n        # После каждой группы, кроме последней, добавляем пустую строку (разделитель)\n        if i < len(buttons) - 1:\n            keyboard.append([])  # пустая строка\n\n    return InlineKeyboardMarkup(inline_keyboard=keyboard)'''
          if old in s:
              s = s.replace(old, '    return InlineKeyboardMarkup(inline_keyboard=buttons)', 1)

          topup = '''        # Группа 2: Пополнение баланса\n        [\n            InlineKeyboardButton(\n                text="⭐ Пополнить баланс",\n                callback_data="topup"\n            ),\n        ],'''
          balance_row = '''        [\n            InlineKeyboardButton(\n                text="💰 Баланс",\n                callback_data="balance"\n            ),\n        ],'''
          if topup in s and 'callback_data="balance"' not in s:
              s = s.replace(topup, topup + '\n' + balance_row, 1)

          if '# BALANCE_BUTTON_V1' not in s:
              anchor = 'register_topup_handlers(dp, bot, lambda: db_pool, SUPPORT_ID)'
              handler = '''\n\n# BALANCE_BUTTON_V1\n@dp.callback_query(F.data == "balance")\nasync def balance_callback(call: types.CallbackQuery):\n    data = await get_user_data(str(call.from_user.id))\n    balance = data.get("balance", 0) if data else 0\n    await call.answer(f"Ваш баланс: {balance} ⭐", show_alert=True)\n'''
              if anchor in s:
                  s = s.replace(anchor, anchor + handler, 1)

          # Remove standalone referral-leader rows from keyboards.
          lines = s.splitlines(True)
          out = []
          i = 0
          while i < len(lines):
              if lines[i].strip() == '[' and i + 1 < len(lines) and 'InlineKeyboardButton(' in lines[i+1]:
                  j = i + 1
                  while j < len(lines) and lines[j].strip() != '],':
                      j += 1
                  if j < len(lines):
                      block = ''.join(lines[i:j+1]).lower()
                      if 'лидер' in block or 'топ реферал' in block or 'callback_data="leaders"' in block or "callback_data='leaders'" in block:
                          i = j + 1
                          continue
              out.append(lines[i])
              i += 1
          s = ''.join(out)

          s = s.replace('        await update_leader(ref_id)\n', '')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py
          if git diff --cached --quiet; then
            git rm .github/workflows/fix-menu.yml
            git commit -m "Remove temporary menu fix workflow"
          else
            git commit -m "Fix menu buttons and remove referral leaders"
            git push
            git rm .github/workflows/fix-menu.yml
            git commit -m "Remove temporary menu fix workflow"
          fi
          git push
