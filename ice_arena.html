<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ice Arena</title><style>*{box-sizing:border-box}body{margin:0;background:#070812;color:#fff;font-family:Inter,system-ui,-apple-system,sans-serif;min-height:100vh}.app{width:100%;max-width:520px;margin:auto;padding:12px 12px 22px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.brand{font-size:21px;font-weight:900}.sub{color:#8f93a9;font-size:11px;margin-top:2px}.pill{background:#111426;border:1px solid #292e48;border-radius:999px;padding:7px 10px;font-size:11px}.hero{background:linear-gradient(145deg,#17102e,#0d1730 60%,#101124);border:1px solid #30345c;border-radius:22px;padding:12px;box-shadow:0 16px 45px #0008}.stats{display:flex;gap:7px;margin-bottom:10px}.stat{flex:1;min-width:0;background:#0b0e1c;border-radius:13px;padding:9px}.stat b{display:block;font-size:17px;line-height:20px}.stat span{display:block;font-size:9px;color:#8f93a9;margin-top:2px;white-space:nowrap}.arena{position:relative;height:min(58vh,360px);min-height:300px;border-radius:18px;overflow:hidden;background:#16182a;border:1px solid #ffffff22}.grid{position:absolute;inset:0;background-image:linear-gradient(#ffffff0b 1px,transparent 1px),linear-gradient(90deg,#ffffff0b 1px,transparent 1px);background-size:42px 42px;z-index:0}.zone{position:absolute;inset:0;opacity:.98}.z1{clip-path:polygon(0 0,50% 0,50% 50%,0 50%);background:linear-gradient(135deg,#ff4b91,#e51d73)}.z2{clip-path:polygon(50% 0,100% 0,100% 50%,50% 50%);background:linear-gradient(135deg,#7c4dff,#4520d8)}.z3{clip-path:polygon(0 50%,50% 50%,50% 100%,0 100%);background:linear-gradient(135deg,#ff9b38,#e65b18)}.z4{clip-path:polygon(50% 50%,100% 50%,100% 100%,50% 100%);background:linear-gradient(135deg,#27d6c4,#087fbc)}.zoneLine{position:absolute;background:#ffffff70;z-index:2;pointer-events:none}.vline{width:2px;height:100%;left:50%;top:0}.hline{height:2px;width:100%;left:0;top:50%}.label{position:absolute;z-index:3;font-size:11px;font-weight:900;letter-spacing:.3px;text-shadow:0 2px 8px #000}.l1{left:13px;top:13px}.l2{right:13px;top:13px}.l3{left:13px;bottom:13px}.l4{right:13px;bottom:13px}.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;background:#090b16dd;border:2px solid #ffffff80;display:grid;place-items:center;font-size:9px;letter-spacing:1px;font-weight:900;z-index:4;box-shadow:0 0 35px #0009}.orb{position:absolute;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:23px;background:#080a12;border:3px solid #fff;box-shadow:0 0 16px #fff,0 0 45px #ffffffaa;z-index:6;will-change:transform;transition:box-shadow .15s}.orb:after{content:"";position:absolute;width:9px;height:9px;border-radius:50%;background:#fff;top:7px;left:8px}.trail{position:absolute;width:105px;height:12px;border-radius:50%;background:#fff9;filter:blur(8px);z-index:5;pointer-events:none;transform-origin:right center}.winnerFlash{position:absolute;inset:0;z-index:7;pointer-events:none;opacity:0;border:5px solid #fff;box-shadow:inset 0 0 80px #fff,0 0 50px #fff}.winnerFlash.show{animation:flash .8s ease}.winnerText{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.8);z-index:8;background:#090b16ee;border:1px solid #ffffff55;border-radius:16px;padding:12px 18px;text-align:center;opacity:0;pointer-events:none}.winnerText.show{animation:pop .9s ease}.winnerText b{display:block;font-size:20px}.winnerText span{font-size:10px;color:#cbd0e5}@keyframes flash{0%{opacity:0}25%{opacity:1}100%{opacity:0}}@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.8)}25%,70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.05)}.status{display:flex;justify-content:space-between;margin-top:9px;align-items:center}.live{color:#8fffc8;font-size:11px}.timer{font-size:26px;font-weight:900;line-height:30px}.players{margin-top:9px;display:grid;gap:6px}.player{background:#0b0e1b;border:1px solid #242840;border-radius:13px;padding:8px 9px;display:flex;align-items:center;gap:9px}.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:0 0 32px;border:2px solid #ffffff55}.pn{flex:1;min-width:0}.pn b{display:block;font-size:13px}.pn span{font-size:9px;color:#8f93a9}.pct{font-weight:900;font-size:16px}.meRow{border-color:#e23caa}.controls{margin-top:9px;background:#101323;border:1px solid #282d45;border-radius:16px;padding:10px}.betgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.bet{background:#181c2e;border:1px solid #30364f;border-radius:10px;padding:9px;font-weight:800;cursor:pointer;color:#fff}.bet.active{background:#7b2165;border-color:#ff58bf}.join{width:100%;margin-top:7px;background:linear-gradient(90deg,#9a2cff,#ff2c91);padding:12px;border-radius:12px;font-weight:900;cursor:pointer;color:#fff;border:0}.note{font-size:9px;color:#777d98;text-align:center;margin-top:7px}.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:9px}.nav button{background:#101323;border:1px solid #242940;border-radius:11px;padding:9px 4px;font-size:10px;color:#aeb2c7}.nav button:first-child{color:#fff;border-color:#444b6d}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(20px);background:#fff;color:#090a12;padding:9px 13px;border-radius:999px;font-size:11px;font-weight:800;opacity:0;transition:.2s;pointer-events:none;z-index:20;white-space:nowrap}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}</style></head><body><main class="app"><div class="top"><div><div class="brand">❄️ Ice Arena</div><div class="sub">PvP · realtime arena</div></div><div class="pill">● 8 онлайн</div></div><section class="hero"><div class="stats"><div class="stat"><b id="pool">4.5</b><span>виртуальный пул</span></div><div class="stat"><b id="count">4/4</b><span>игроков</span></div><div class="stat"><b id="mybet">0.5</b><span>моя ставка</span></div></div><div class="arena" id="arena"><div class="grid"></div><div class="zone z1"></div><div class="zone z2"></div><div class="zone z3"></div><div class="zone z4"></div><div class="zoneLine vline"></div><div class="zoneLine hline"></div><div class="label l1">🩷 Ты</div><div class="label l2">🟣 Neon</div><div class="label l3">🟠 Orange</div><div class="label l4">🔵 Frost</div><div class="center">ICE<br>CORE</div><div id="trail" class="trail"></div><div id="orb" class="orb">⚪</div><div id="winnerFlash" class="winnerFlash"></div><div id="winnerText" class="winnerText"><b id="winnerName">Победитель</b><span id="winnerChance"></span></div></div><div class="status"><span class="live">● LIVE · simulation</span><span class="timer" id="timer">6.0</span></div><div class="players" id="players"></div><div class="controls"><div class="betgrid"><button class="bet" data-v="0.1">0.1</button><button class="bet active" data-v="0.5">0.5</button><button class="bet" data-v="1">1</button><button class="bet" data-v="5">5</button><button class="bet" data-v="10">10</button><button class="bet" data-v="50">50</button></div><button class="join" id="join">⚡ Войти в Ice Arena</button><div class="note">Демо-режим: виртуальные очки. Чем больше ставка, тем выше шанс игрока. TON/Stars/Gifts не списываются.</div></div></section></main><div class="nav"><button>🛍 Магазин</button><button>⚔️ PvP</button><button>🎯 Solo</button><button>👤 Профиль</button></div><div class="toast" id="toast"></div><script>const players=[{name:'Ты',bet:.5,color:'#ff4b91',emoji:'🩷'},{name:'Frost',bet:1,color:'#27d6c4',emoji:'🔵'},{name:'Neon',bet:2,color:'#7c4dff',emoji:'🟣'},{name:'Orange',bet:1,color:'#ff9b38',emoji:'🟠'}];let bet=.5,running=true,t=6,last=performance.now(),resetTimer=null,winner=null;const arena=document.getElementById('arena'),orb=document.getElementById('orb'),trail=document.getElementById('trail');let x=.5,y=.5,vx=.9,vy=.62;function total(){return players.reduce((s,p)=>s+p.bet,0)}function chance(p){return p.bet/total()*100}function render(){document.getElementById('pool').textContent=total().toFixed(1);document.getElementById('players').innerHTML=players.map((p,i)=>`<div class="player ${i===0?'meRow':''}"><div class="avatar" style="background:${p.color}22;border-color:${p.color}">${p.emoji}</div><div class="pn"><b>${p.name}</b><span>${p.bet} VP · цвет ${p.color}</span></div><div class="pct">${chance(p).toFixed(1)}%</div></div>`).join('');document.getElementById('mybet').textContent=bet.toFixed(1)}document.querySelectorAll('.bet').forEach(b=>b.onclick=()=>{document.querySelectorAll('.bet').forEach(x=>x.classList.remove('active'));b.classList.add('active');bet=+b.dataset.v;players[0].bet=bet;render();toast('Ставка '+bet+' VP → шанс '+chance(players[0]).toFixed(1)+'%')});function toast(s){const q=document.getElementById('toast');q.textContent=s;q.classList.add('show');setTimeout(()=>q.classList.remove('show'),1400)}function chooseWinner(){let r=Math.random()*total();for(const p of players){r-=p.bet;if(r<=0)return p}return players[0]}function targetFor(p){if(p.name==='Ты')return{x:.25,y:.25};if(p.name==='Neon')return{x:.75,y:.25};if(p.name==='Orange')return{x:.25,y:.75};return{x:.75,y:.75}}function place(){orb.style.left=(x*100)+'%';orb.style.top=(y*100)+'%';const a=Math.atan2(vy,vx);trail.style.left=(x*100)+'%';trail.style.top=(y*100)+'%';trail.style.transform=`translate(-92%,-50%) rotate(${a}rad) scaleX(${Math.min(1.8,Math.hypot(vx,vy)*1.3)})`}function finish(){running=false;t=0;document.getElementById('timer').textContent='0.0';winner=chooseWinner();const target=targetFor(winner);x=target.x;y=target.y;place();document.getElementById('winnerName').textContent='🏆 '+winner.name;document.getElementById('winnerChance').textContent='Ставка '+winner.bet+' VP · шанс '+chance(winner).toFixed(1)+'%';document.getElementById('winnerText').classList.remove('show');document.getElementById('winnerFlash').classList.remove('show');void document.getElementById('winnerText').offsetWidth;document.getElementById('winnerText').classList.add('show');document.getElementById('winnerFlash').classList.add('show');resetTimer=setTimeout(reset,1100)}function reset(){t=6;running=true;winner=null;x=.5;y=.5;vx=(Math.random()>.5?1:-1)*(.8+Math.random()*.25);vy=(Math.random()>.5?1:-1)*(.55+Math.random()*.22);last=performance.now();document.getElementById('timer').textContent='6.0';place()}document.getElementById('join').onclick=()=>{if(resetTimer)clearTimeout(resetTimer);reset();toast('Ты вошёл в арену ⚡')};function loop(now){const dt=Math.min((now-last)/1000,.05);last=now;if(running){t-=dt;if(t<=0)finish();else{document.getElementById('timer').textContent=t.toFixed(1);const r=24/arena.clientWidth;x+=vx*dt;y+=vy*dt;if(x<r){x=r;vx=Math.abs(vx)}if(x>1-r){x=1-r;vx=-Math.abs(vx)}if(y<r){y=r;vy=Math.abs(vy)}if(y>1-r){y=1-r;vy=-Math.abs(vy)}place()}}requestAnimationFrame(loop)}render();reset();requestAnimationFrame(loop);</script></body></html>
