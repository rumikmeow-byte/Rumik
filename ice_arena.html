<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ice Arena</title><style>*{box-sizing:border-box}body{margin:0;background:#070812;color:#fff;font-family:Inter,system-ui,sans-serif}.app{max-width:560px;margin:auto;padding:14px 12px 90px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.brand{font-size:22px;font-weight:950}.online{background:#111526;border:1px solid #2b3150;border-radius:20px;padding:8px 11px;font-size:11px}.hero{background:#101322;border:1px solid #2a3049;border-radius:24px;padding:11px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{background:#090b15;border-radius:14px;padding:10px}.stat b{font-size:17px}.stat span{display:block;color:#777e99;font-size:9px;margin-top:3px}.arena{position:relative;height:390px;margin-top:10px;border-radius:22px;overflow:hidden;background:#0a0d17;border:1px solid #ffffff22}.zone{position:absolute;transition:all .45s ease}.z1{left:0;top:0;height:100%;width:0;background:linear-gradient(135deg,#ff3f91,#b70e61)}.z2{right:0;top:0;height:100%;width:0;background:linear-gradient(135deg,#7548ff,#4015d0)}.z3{left:0;bottom:0;height:0;width:50%;background:linear-gradient(135deg,#ffad3c,#dc5911)}.z4{right:0;bottom:0;height:0;width:50%;background:linear-gradient(135deg,#29dac4,#087ebd)}.empty{position:absolute;inset:0;display:grid;place-items:center;color:#69718c;font-weight:900;font-size:13px;letter-spacing:1px}.zoneLine{position:absolute;background:#ffffff22;z-index:2}.vline{width:1px;height:100%;left:50%}.hline{height:1px;width:100%;top:50%}.zoneLabel{position:absolute;z-index:3;font-weight:900;font-size:11px;text-shadow:0 2px 8px #000}.l1{left:12px;top:12px}.l2{right:12px;top:12px}.l3{left:12px;bottom:12px}.l4{right:12px;bottom:12px}.orb{position:absolute;width:46px;height:46px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;font-size:21px;box-shadow:0 0 18px #fff,0 0 45px #ffffff99;z-index:5;transition:box-shadow .3s}.status{display:flex;justify-content:space-between;align-items:center;margin:10px 2px}.timer{font-size:27px;font-weight:950}.players{display:grid;gap:6px}.player{display:flex;align-items:center;gap:9px;background:#0b0e19;border:1px solid #222840;border-radius:14px;padding:8px}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center}.pn{flex:1}.pn b{display:block;font-size:13px}.pn span{font-size:9px;color:#777e99}.pct{font-weight:950}.controls{margin-top:9px;background:#111526;border:1px solid #292f49;border-radius:18px;padding:11px}.betgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.bet{border:1px solid #303650;background:#181c2d;color:#fff;border-radius:11px;padding:10px;font-weight:900}.bet.active{background:linear-gradient(135deg,#8c2dff,#ed268d)}.join{width:100%;margin-top:8px;border:0;border-radius:13px;padding:13px;background:linear-gradient(90deg,#8c2dff,#ff2c91);color:#fff;font-weight:950}.note{text-align:center;color:#6e758f;font-size:9px;margin-top:7px}.nav{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);width:min(534px,calc(100% - 20px));display:grid;grid-template-columns:repeat(4,1fr);padding:6px;background:#0d0f1bf5;border:1px solid #292e46;border-radius:18px}.nav button{background:transparent;border:0;color:#858ba5;padding:8px;font-size:10px}.nav button:nth-child(2){color:#fff;background:#1b1e30;border-radius:11px}.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);background:#fff;color:#111;padding:9px 13px;border-radius:20px;font-size:11px;font-weight:900;display:none}.toast.show{display:block}</style></head><body><main class="app"><div class="top"><div class="brand">❄️ Ice Arena</div><div class="online">🟢 8 онлайн</div></div><section class="hero"><div class="stats"><div class="stat"><b id="pool">0.0</b><span>пул VP</span></div><div class="stat"><b id="count">0/4</b><span>игроков</span></div><div class="stat"><b id="mybet">0.0</b><span>моя ставка</span></div></div><div class="arena" id="arena"><div class="empty" id="empty">ПОЛЕ СВОБОДНО<br>Сделай ставку, чтобы занять территорию</div><div class="zone z1" id="z1"></div><div class="zone z2" id="z2"></div><div class="zone z3" id="z3"></div><div class="zone z4" id="z4"></div><div class="zoneLine vline"></div><div class="zoneLine hline"></div><div class="zoneLabel l1">🩷 Ты</div><div class="zoneLabel l2">🟣 Neon</div><div class="zoneLabel l3">🟠 Orange</div><div class="zoneLabel l4">🔵 Frost</div><div class="orb" id="orb">⚪</div></div><div class="status"><span>⚡ LIVE · виртуальная игра</span><span class="timer" id="timer">—</span></div><div class="players" id="players"></div><div class="controls"><b>Размер твоей территории</b><div class="betgrid"><button class="bet" data-v="0.1">0.1 VP</button><button class="bet active" data-v="0.5">0.5 VP</button><button class="bet" data-v="1">1 VP</button><button class="bet" data-v="5">5 VP</button><button class="bet" data-v="10">10 VP</button><button class="bet" data-v="50">50 VP</button></div><button class="join" id="join">⚡ Войти и занять поле</button><div class="note">Демо: виртуальные VP. Чем больше ставка, тем больше твоя территория и выше шанс победы.</div></div></section></main><nav class="nav"><button>🛍<br>Магазин</button><button>⚔️<br>PvP</button><button>🎯<br>Solo</button><button>👤<br>Профиль</button></nav><div class="toast" id="toast"></div><script>const colors=['#ff4b91','#7c4dff','#ff9b38','#27d6c4'],names=['Ты','Neon','Orange','Frost'],emojis=['🩷','🟣','🟠','🔵'];let players=[],selected=.5,running=false,timer=0,x=.5,y=.5,vx=.9,vy=.65,last=performance.now();const $=id=>document.getElementById(id),arena=$('arena'),orb=$('orb');function total(){return players.reduce((s,p)=>s+p.bet,0)}function render(){const sum=total();$('pool').textContent=sum.toFixed(1);$('count').textContent=players.length+'/4';$('mybet').textContent=players.find(p=>p.name==='Ты')?.bet.toFixed(1)||'0.0';$('empty').style.display=players.length?'none':'grid';$('players').innerHTML=players.map(p=>`<div class="player"><div class="avatar" style="background:${p.color}33;border:2px solid ${p.color}">${p.emoji}</div><div class="pn"><b>${p.name}</b><span>${p.bet} VP · территория ${(p.bet/sum*100).toFixed(1)}%</span></div><div class="pct">${(p.bet/sum*100).toFixed(1)}%</div></div>`).join('');drawZones()}function drawZones(){const sum=total();['z1','z2','z3','z4'].forEach(id=>$(id).style.cssText='');players.forEach((p,i)=>{const pct=p.bet/sum;const z=$(['z1','z2','z3','z4'][i]);if(!z)return;if(i<2){z.style.width=(pct*100)+'%';z.style.height='100%';z.style.left=i===0?'0':'auto';z.style.right=i===1?'0':'auto';z.style.top='0'}else{z.style.width='50%';z.style.height=(pct*200)+'%';z.style.left=i===2?'0':'auto';z.style.right=i===3?'0':'auto';z.style.bottom='0'}})}document.querySelectorAll('.bet').forEach(b=>b.onclick=()=>{document.querySelectorAll('.bet').forEach(x=>x.classList.remove('active'));b.classList.add('active');selected=+b.dataset.v;toast('Выбрано '+selected+' VP')});function toast(s){const q=$('toast');q.textContent=s;q.classList.add('show');setTimeout(()=>q.classList.remove('show'),1200)}$('join').onclick=()=>{if(players.length>=4)return toast('Арена заполнена');if(players.some(p=>p.name==='Ты'))return toast('Ты уже в игре');players.push({name:'Ты',bet:selected,color:colors[0],emoji:emojis[0]});render();timer=6;running=true;x=.5;y=.5;toast('Твоя территория занята 🩷')};function winner(){let r=Math.random()*total();for(const p of players){r-=p.bet;if(r<=0)return p}return players[0]}function loop(now){const dt=Math.min((now-last)/1000,.05);last=now;if(running){timer-=dt;$('timer').textContent=Math.max(0,timer).toFixed(1);x+=vx*dt;y+=vy*dt;if(x<.06||x>.94)vx*=-1;if(y<.07||y>.93)vy*=-1;x=Math.max(.06,Math.min(.94,x));y=Math.max(.07,Math.min(.93,y));orb.style.left=(x*100)+'%';orb.style.top=(y*100)+'%';if(timer<=0){const w=winner();toast('🏆 '+w.name+' победил · '+(w.bet/total()*100).toFixed(1)+'%');running=false;setTimeout(()=>{timer=0;$('timer').textContent='—'},900)}}requestAnimationFrame(loop)}render();requestAnimationFrame(loop)</script></body></html>
