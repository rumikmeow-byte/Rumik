<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ice Arena</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070812;color:#fff;font-family:Inter,system-ui,-apple-system,sans-serif;min-height:100vh;overflow-x:hidden}.app{width:100%;max-width:520px;margin:auto;padding:12px 12px 22px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.brand{font-size:21px;font-weight:900}.sub{color:#8f93a9;font-size:11px;margin-top:2px}.pill{background:#111426;border:1px solid #292e48;border-radius:999px;padding:7px 10px;font-size:11px}.hero{background:linear-gradient(145deg,#17102e,#0d1730 60%,#101124);border:1px solid #30345c;border-radius:22px;padding:12px;box-shadow:0 16px 45px #0008}.stats{display:flex;gap:7px;margin-bottom:10px}.stat{flex:1;min-width:0;background:#0b0e1c;border-radius:13px;padding:9px}.stat b{display:block;font-size:17px;line-height:20px}.stat span{display:block;font-size:9px;color:#8f93a9;margin-top:2px;white-space:nowrap}.arena{position:relative;height:min(58vh,360px);min-height:300px;border-radius:18px;overflow:hidden;background:radial-gradient(circle at 25% 30%,#8226ad 0 13%,transparent 36%),radial-gradient(circle at 75% 65%,#f02b82 0 10%,transparent 38%),linear-gradient(135deg,#201052,#44145e 45%,#5b1749);border:1px solid #ffffff22}.arena:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,#ffffff0b 35.2%,transparent 36%,transparent 62%,#fff1 62.2%,transparent 63%);mix-blend-mode:screen;pointer-events:none}.grid{position:absolute;inset:0;background-image:linear-gradient(#ffffff09 1px,transparent 1px),linear-gradient(90deg,#ffffff09 1px,transparent 1px);background-size:42px 42px}.orb{position:absolute;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:21px;background:#0b0d18;border:3px solid #fff;box-shadow:0 0 22px #fff8;z-index:4;transition:left .16s linear,top .16s linear;will-change:left,top}.orb.me{border-color:#ff4db8}.zone{position:absolute;border-radius:50%;filter:blur(2px);opacity:.2;z-index:1}.z1{width:190px;height:190px;background:#ff2e9d;left:-55px;top:120px}.z2{width:250px;height:250px;background:#7c35ff;right:-75px;top:-35px}.z3{width:180px;height:180px;background:#ff8b35;right:15px;bottom:-60px}.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:10px;letter-spacing:2px;color:#fff8;z-index:3;white-space:nowrap}.status{display:flex;justify-content:space-between;margin-top:9px;align-items:center}.live{color:#8fffc8;font-size:11px}.timer{font-size:26px;font-weight:900;line-height:30px}.players{margin-top:9px;display:grid;gap:6px}.player{background:#0b0e1b;border:1px solid #242840;border-radius:13px;padding:8px 9px;display:flex;align-items:center;gap:9px}.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#191d32;flex:0 0 32px}.pn{flex:1;min-width:0}.pn b{display:block;font-size:13px}.pn span{font-size:9px;color:#8f93a9}.pct{font-weight:900;font-size:16px}.meRow{border-color:#e23caa}.controls{margin-top:9px;background:#101323;border:1px solid #282d45;border-radius:16px;padding:10px}.betgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.bet{background:#181c2e;border:1px solid #30364f;border-radius:10px;padding:9px;font-weight:800;cursor:pointer}.bet.active{background:#7b2165;border-color:#ff58bf}.join{width:100%;margin-top:7px;background:linear-gradient(90deg,#9a2cff,#ff2c91);padding:12px;border-radius:12px;font-weight:900;cursor:pointer}.note{font-size:9px;color:#777d98;text-align:center;margin-top:7px}.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:9px}.nav button{background:#101323;border:1px solid #242940;border-radius:11px;padding:9px 4px;font-size:10px;color:#aeb2c7}.nav button:first-child{color:#fff;border-color:#444b6d}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(20px);background:#fff;color:#090a12;padding:9px 13px;border-radius:999px;font-size:11px;font-weight:800;opacity:0;transition:.2s;pointer-events:none;z-index:20;white-space:nowrap}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style></head><body><main class="app"><div class="top"><div><div class="brand">❄️ Ice Arena</div><div class="sub">PvP · realtime arena</div></div><div class="pill">● 8 онлайн</div></div><section class="hero"><div class="stats"><div class="stat"><b id="pool">8.5</b><span>виртуальный пул</span></div><div class="stat"><b id="count">4/4</b><span>игроков</span></div><div class="stat"><b id="mybet">0.5</b><span>моя ставка</span></div></div><div class="arena"><div class="grid"></div><div class="zone z1"></div><div class="zone z2"></div><div class="zone z3"></div><div class="center">ICE CORE</div><div id="o1" class="orb me" style="left:13%;top:52%">⚪</div><div id="o2" class="orb" style="left:65%;top:20%">🔵</div><div id="o3" class="orb" style="left:73%;top:68%">🟣</div><div id="o4" class="orb" style="left:37%;top:32%">🟠</div></div><div class="status"><span class="live">● LIVE · simulation</span><span class="timer" id="timer">6.0</span></div><div class="players" id="players"></div><div class="controls"><div class="betgrid"><button class="bet" data-v="0.1">0.1</button><button class="bet active" data-v="0.5">0.5</button><button class="bet" data-v="1">1</button><button class="bet" data-v="5">5</button><button class="bet" data-v="10">10</button><button class="bet" data-v="50">50</button></div><button class="join" id="join">⚡ Войти в Ice Arena</button><div class="note">Демо-режим: используются виртуальные очки. TON/Stars/Gifts не списываются.</div></div></section><div class="nav"><button>🛍 Магазин</button><button>⚔️ PvP</button><button>🎯 Solo</button><button>👤 Профиль</button></div></main><div class="toast" id="toast"></div><script>
const players=[['Ты','0.5','50.00%','🧊'],['Frost','1','16.67%','🔵'],['Neon','2','33.33%','🟣'],['Orange','1','16.67%','🟠']];let bet=.5,running=true,t=6,resetTimer=null;
function render(){document.getElementById('players').innerHTML=players.map((p,i)=>`<div class="player ${i===0?'meRow':''}"><div class="avatar">${p[3]}</div><div class="pn"><b>${p[0]}</b><span>${p[1]} VP</span></div><div class="pct">${p[2]}</div></div>`).join('');document.getElementById('mybet').textContent=bet.toFixed(1)}
document.querySelectorAll('.bet').forEach(b=>b.onclick=()=>{document.querySelectorAll('.bet').forEach(x=>x.classList.remove('active'));b.classList.add('active');bet=+b.dataset.v;render();toast('Ставка выбрана: '+bet+' VP')});
function toast(s){let x=document.getElementById('toast');x.textContent=s;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1200)}
document.getElementById('join').onclick=()=>{if(resetTimer)clearTimeout(resetTimer);running=true;t=6;document.getElementById('timer').textContent='6.0';toast('Ты вошёл в арену ⚡')};
render();
setInterval(()=>{if(!running)return;t-=.1;if(t<=0){t=0;running=false;document.getElementById('timer').textContent='0.0';toast('🏆 Раунд завершён');resetTimer=setTimeout(()=>{t=6;running=true;document.getElementById('timer').textContent='6.0'},700);return}document.getElementById('timer').textContent=t.toFixed(1);['o1','o2','o3','o4'].forEach(id=>{let e=document.getElementById(id);e.style.left=(8+Math.random()*82)+'%';e.style.top=(7+Math.random()*82)+'%'});},120);
</script></body></html>
